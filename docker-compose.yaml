services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: tendaku-app
        container_name: tendaku_app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - ./:/var/www
        env_file:
            - .env
        environment:
            OPENROUTESERVICE_API_KEY: ${OPENROUTESERVICE_API_KEY}
            OPENROUTESERVICE_BASE_URL: ${OPENROUTESERVICE_BASE_URL}
            OPENROUTESERVICE_PROFILE: ${OPENROUTESERVICE_PROFILE}
            OPENROUTESERVICE_TIMEOUT: ${OPENROUTESERVICE_TIMEOUT}
            OPENROUTESERVICE_RETRY_TIMES: ${OPENROUTESERVICE_RETRY_TIMES}
            OPENROUTESERVICE_RETRY_SLEEP_MS: ${OPENROUTESERVICE_RETRY_SLEEP_MS}
            OPENROUTESERVICE_CACHE_TTL: ${OPENROUTESERVICE_CACHE_TTL}
        networks:
            - tendaku-network

    nginx:
        image: nginx:alpine
        container_name: tendaku_nginx
        restart: unless-stopped
        ports:
            - "8002:80"
        volumes:
            - ./:/var/www
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
        networks:
            - tendaku-network
        depends_on:
            - app

    mailpit:
        image: axllent/mailpit:latest
        container_name: tendaku_mailpit
        restart: unless-stopped
        ports:
            - "1025:1025"
            - "8025:8025"
        networks:
            - tendaku-network
        depends_on:
            - app

networks:
    tendaku-network:
        driver: bridge

volumes:
    db-data:
